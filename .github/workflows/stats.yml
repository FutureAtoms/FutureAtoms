name: Contribution cards

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the cards (counts only, no repository names)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/build_stats.py --accounts AC-e-AI,FutureAtoms --out stats --combined --label "AC-e-AI=Work account" --label "FutureAtoms=FutureAtoms studio"
      - name: Commit when something changed
        run: |
          git config user.name "Abhilash Chadhar"
          git config user.email "chadharabhilash@gmail.com"
          git add stats
          git diff --cached --quiet || git commit -m "Contribution cards $(date -u +%F)"
          git push
